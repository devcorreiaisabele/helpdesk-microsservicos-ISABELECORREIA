name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  testes:
    name: Testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # um serviço quebrado não esconde o resultado dos outros
      matrix:
        servico: [usuarios, inventario, chamados, notificacoes, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências do serviço
        run: |
          python -m pip install --upgrade pip
          if [ -f ../requirements-dev.txt ]; then pip install -r ../requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest httpx pyjwt
      - name: Testes do serviço (inclui testes de segurança)
        run: python -m pytest -q
      - name: Dependências com falhas conhecidas
        run: |
          pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi
